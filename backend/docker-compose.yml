version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: car_advisor_db
    restart: always
    environment:
      POSTGRES_USER: car_user
      POSTGRES_PASSWORD: car_password
      POSTGRES_DB: car_advisor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: